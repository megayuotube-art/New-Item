name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "flet[cli]" pandas numpy requests yfinance

    - name: Build Flet APK
      run: |
        flet build apk --yes

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forex-AI-Pro-APK
        path: build/apk/*.apk
