workflows:
  flet-android-build:
    name: Flet Android APK Build
    max_build_duration: 60
    instance_type: linux
    environment:
      flutter: stable
      vars:
        # Flet build paytida savol bermasligi uchun
        CI: "true"
    scripts:
      - name: Install Python dependencies
        script: |
          pip3 install --upgrade pip
          pip3 install flet
          # Agar requirements.txt faylingiz bo'lsa, pastdagi qatorni ham oching:
          # pip3 install -r requirements.txt

      - name: Build Flet APK
        script: |
          yes | flet build apk --yes

    artifacts:
      - build/apk/*.apk
