workflows:
  flet-android-build:
    name: Flet Android APK Build
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        CI: "true"
        FLET_SUPPRESS_ANALYTICS: "true"
    scripts:
      - name: Install Python dependencies
        script: |
          pip3 install --upgrade pip
          pip3 install flet==1.1.1
      - name: Build Flet APK
        script: |
          yes | flet build apk
    artifacts:
      - build/apk/*.apk
